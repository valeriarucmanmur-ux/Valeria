name: Сайт-приложение (iPhone и Android)

on:
  push:
    branches: ["claude/nifty-franklin-zsxgc2", "main"]
    paths: ["app/**", "tools/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Скачать фото мест
        run: npm run photos || echo "Часть фото не скачалась"
      - name: Сжать фото
        run: pip install -q pillow && python3 tools/optimize-photos.py
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
